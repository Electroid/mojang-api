# Isolated archive worker. Do not bind legacy KV/DO namespaces from mojang_api_v1/v2/v3.
name = "mojang-archive"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "301982b3799377b8f6c0fbeeed3ee65f"
workers_dev = true

[observability]
enabled = true

[vars]
# Cloudflare-only. Unit tests override EGRESS_METHODS=fetch so MSW can intercept.
EGRESS_METHODS = "socket,fetch"
TCP_SHARDS = "4"
FRESH_MS = "300000"
NEGATIVE_MS = "60000"
TOKEN_RESERVE = "4"

[[durable_objects.bindings]]
name = "ARCHIVE_NAMES"
class_name = "ArchiveName"

[[durable_objects.bindings]]
name = "ARCHIVE_PROFILES"
class_name = "ArchiveProfile"

[[durable_objects.bindings]]
name = "ARCHIVE_EGRESS"
class_name = "ArchiveEgress"

[[durable_objects.bindings]]
name = "ARCHIVE_CLIENTS"
class_name = "ArchiveClient"

[[durable_objects.bindings]]
name = "ARCHIVE_TCP"
class_name = "ArchiveTcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArchiveName", "ArchiveProfile", "ArchiveEgress", "ArchiveClient"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ArchiveTcp"]

# New route only. Does not replace api.ashcon.app/mojang/v1* or /v2*.
[[routes]]
pattern = "api.ashcon.app/mojang/v4*"
zone_name = "ashcon.app"
